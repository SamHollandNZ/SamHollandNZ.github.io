<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.first_name }} {{ site.last_name }}</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
{% include header.html %}
<main id="main" class="main">
{{ content }}
</main>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
