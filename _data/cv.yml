      - 'Authored the conference paper: Improved Secondary Layer Control of DC Microgrid Cluster with Hybrid PSO-GWO Optimization, IEEE TENSYMP 2025. DOI: <a href="https://doi.org/10.1109/TENSYMP63728.2025.11144982">10.1109/TENSYMP63728.2025.11144982</a>'
